name: supabase_client_gen
description: Contract-driven code generator that reads a supabase.yaml specification and produces typed Dart client code — data models, enums, repositories with CRUD and realtime streams, and edge function clients.
version: 0.1.0
homepage: https://github.com/moinsen-dev/supabase_client_gen
repository: https://github.com/moinsen-dev/supabase_client_gen
issue_tracker: https://github.com/moinsen-dev/supabase_client_gen/issues
environment:
  sdk: ^3.3.0

dependencies:
  yaml: ^3.1.0
  postgres: ^3.0.0
executables:
  generate: generate
  validate: validate
dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
