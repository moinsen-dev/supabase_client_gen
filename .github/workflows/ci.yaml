name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Format check (authored source only — goldens are policed by the golden test)
        run: dart format --output=none --set-exit-if-changed lib bin test/*_test.dart
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test (goldens + behaviour + validation)
        run: dart test

  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub get
      - name: Compile generated code against real supabase_flutter/equatable
        run: bash tool/compile_check.sh
