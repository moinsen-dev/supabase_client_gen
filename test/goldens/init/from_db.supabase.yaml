# demo Supabase contract — DRAFT generated by supabase_client_gen:init.
#
# Source: live database introspection (init --from-db).
# Review every `# TODO review` marker before adopting this contract:
#   - client_access defaults to select-for-authenticated and edge_function_only
#     writes — tighten or open per table to match your RLS policies.
#   - ownership is guessed from the presence of a workspace_id column.
#
# Then generate the typed client:
#   dart pub global run supabase_client_gen:generate \
#     --contract supabase.yaml --output lib/generated

contract:
  name: demo_supabase_contract
  version: "0.1.0"
  date: "2026-06-12"

project:
  remote:
    name: demo
    ref: TODO_PROJECT_REF # TODO review: set your Supabase project ref

auth:
  provider: supabase
  planned_sign_in_methods: # TODO review: list your actual sign-in methods
    - email

data_model:
  public:
    session_players:
      ownership: global # TODO review: guessed (no workspace_id column)
      primary_key: [session_id, user_id]
      # TODO review: add a description for this table.
      fields:
        score: integer
        session_id: uuid
        user_id: uuid
      client_access:
        select: authenticated # TODO review
        insert: edge_function_only # TODO review
        update: edge_function_only # TODO review
        delete: edge_function_only # TODO review

    things:
      ownership: workspace # TODO review: guessed from workspace_id column
      primary_key: id
      # TODO review: add a description for this table.
      fields:
        category: thing_category
        created_at: timestamptz
        id: uuid
        location: text # TODO review: unmapped Postgres type 'geometry'
        name: text
        notes: text
        tags: text[]
        workspace_id: uuid
      nullable_fields:
        - location
        - notes
        - tags
      enum_values:
        thing_category:
          - device
          - document
          - other
      client_access:
        select: authenticated # TODO review
        insert: edge_function_only # TODO review
        update: edge_function_only # TODO review
        delete: edge_function_only # TODO review

    things_overview:
      kind: view
      ownership: global # TODO review: guessed (no workspace_id column)
      primary_key: id # TODO review: views have no PK in Postgres — pick the row identity
      # TODO review: add a description for this view.
      fields:
        id: uuid
        name: text
        note_count: bigint
      client_access:
        select: authenticated # TODO review

rpc_functions:
  add_thing_note:
    # TODO review: add a description.
    args:
      p_note: text
      p_pinned: boolean
      p_thing_id: uuid
    optional_args:
      - p_pinned
    returns: uuid

  get_stats:
    # TODO review: add a description.
    returns: json

  list_things:
    # TODO review: add a description.
    args:
      p_workspace_id: uuid
    returns: rows:things

storage:
  buckets:
    avatars:
      public: true # TODO review: public buckets are readable by anyone
      allowed_mime_types:
        - image/jpeg
        - image/png
      file_size_limit_mb: 5

# edge_functions cannot be introspected — declare any functions
# the client invokes manually (see README).

realtime:
  publication:
    allowed_tables:
      - public.things
