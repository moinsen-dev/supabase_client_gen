# Synthetic, fictional contract used as a realistic-scale golden fixture.
# It deliberately exercises the full generator surface (workspace / global /
# user ownership, a non-id primary key, realtime, read-only tables, enums,
# nullable fields, storage buckets, edge functions). No real project data.

contract:
  name: helpdesk_supabase_contract
  version: "1.0.0"
  date: "2026-06-04"

project:
  remote:
    name: helpdesk
    ref: examplehelpdeskref

auth:
  provider: supabase
  planned_sign_in_methods:
    - email
    - oauth

roles:
  workspace_roles:
    owner:
      description: Full access to the workspace.
    agent:
      description: Can handle tickets.

schemas:
  public:
    exposed_to_data_api: true
    purpose: Client-facing tables
  internal:
    exposed_to_data_api: false
    purpose: Server-side only

data_model:
  public:
    # User-owned, no workspace_id -> unscoped repository.
    profiles:
      ownership: user
      primary_key: id
      description: One row per authenticated user.
      fields:
        id: uuid
        display_name: text
        avatar_url: text
        locale: text
        created_at: timestamptz
      nullable_fields:
        - avatar_url
        - locale
      client_access:
        select: own_profile
        insert: own_profile
        update: own_profile
        delete: edge_function_only

    # The workspaces table itself has no workspace_id column -> unscoped.
    workspaces:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        name: text
        plan: workspace_plan
        created_at: timestamptz
      enum_values:
        workspace_plan:
          - free
          - pro
          - enterprise
      client_access:
        select: member_of_workspace
        insert: authenticated
        update: owner
        delete: owner

    workspace_members:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        workspace_id: uuid
        user_id: uuid
        role: text
        invited_by: uuid
        joined_at: timestamptz
      nullable_fields:
        - invited_by
        - joined_at
      client_access:
        select: member_of_workspace
        insert: owner
        update: owner
        delete: owner

    customers:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        workspace_id: uuid
        email: text
        full_name: text
        company: text
      nullable_fields:
        - company
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: member_of_workspace
        delete: member_of_workspace

    tickets:
      ownership: workspace
      primary_key: id
      description: Support tickets, realtime.
      fields:
        id: uuid
        workspace_id: uuid
        customer_id: uuid
        subject: text
        status: ticket_status
        priority: ticket_priority
        assignee_id: uuid
        satisfaction: numeric
        created_at: timestamptz
        updated_at: timestamptz
      nullable_fields:
        - assignee_id
        - satisfaction
      enum_values:
        ticket_status:
          - open
          - pending
          - resolved
          - closed
        ticket_priority:
          - low
          - normal
          - high
          - urgent
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: member_of_workspace
        delete: owner

    ticket_comments:
      ownership: workspace
      primary_key: id
      description: Comments on tickets, realtime.
      fields:
        id: uuid
        workspace_id: uuid
        ticket_id: uuid
        author_id: uuid
        body: text
        is_internal: boolean
        created_at: timestamptz
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: member_of_workspace
        delete: member_of_workspace

    tags:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        workspace_id: uuid
        label: text
        color: text
      nullable_fields:
        - color
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: member_of_workspace
        delete: member_of_workspace

    # Non-id primary key -> exercises the primary_key fix.
    knowledge_articles:
      ownership: workspace
      primary_key: article_id
      description: Knowledge-base articles.
      fields:
        article_id: uuid
        workspace_id: uuid
        title: text
        body: text
        embedding: vector(1536)
        published: boolean
        updated_at: timestamptz
      nullable_fields:
        - embedding
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: member_of_workspace
        delete: member_of_workspace

    attachments:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        workspace_id: uuid
        ticket_id: uuid
        storage_path: text
        mime_type: text
        size_bytes: bigint
        metadata: jsonb
      nullable_fields:
        - metadata
      client_access:
        select: member_of_workspace
        insert: member_of_workspace
        update: edge_function_only
        delete: member_of_workspace

    # Global, realtime, read-only (server-managed) -> unscoped repo with stream.
    announcements:
      ownership: global
      primary_key: id
      fields:
        id: uuid
        title: text
        body: text
        published_at: timestamptz
      client_access:
        select: authenticated
        insert: edge_function_only
        update: edge_function_only
        delete: edge_function_only

    # Workspace, realtime, read-only -> scoped repo with stream, no mutations.
    notifications:
      ownership: workspace
      primary_key: id
      fields:
        id: uuid
        workspace_id: uuid
        kind: text
        payload: jsonb
        read_at: timestamptz
        created_at: timestamptz
      nullable_fields:
        - read_at
      client_access:
        select: member_of_workspace
        insert: edge_function_only
        update: edge_function_only
        delete: edge_function_only

    # Fully read-only, no realtime -> no repository generated.
    audit_log:
      ownership: global
      primary_key: id
      fields:
        id: uuid
        actor_id: uuid
        action: text
        created_at: timestamptz
      client_access:
        select: authenticated
        insert: edge_function_only
        update: edge_function_only
        delete: edge_function_only

storage:
  buckets:
    avatars:
      public: true
      allowed_mime_types:
        - image/png
        - image/jpeg
      file_size_limit_mb: 2
    ticket_attachments:
      public: false
      allowed_mime_types:
        - application/pdf
        - image/png
        - text/plain
      file_size_limit_mb: 25

edge_functions:
  runtime: deno
  create_ticket:
    method: POST
    description: Create a ticket and notify the assignee.
    required_request_fields:
      - workspace_id
      - subject
    optional_request_fields:
      - priority
      - customer_id
  search_articles:
    method: POST
    description: Semantic search over the knowledge base.
    required_request_fields:
      - workspace_id
      - query

realtime:
  publication:
    allowed_tables:
      - public.tickets
      - public.ticket_comments
      - public.notifications
    replica_identity_full:
      - public.tickets
      - public.ticket_comments
  events:
    ticket_updated:
      source: public.tickets
      audience: workspace_members
    notification_created:
      source: public.notifications
      audience: workspace_members
